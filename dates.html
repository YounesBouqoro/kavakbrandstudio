<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KAVAK Brand Studio – Ordertage & Messetermine. Aktuelle Termine für Fashion Trade Fairs in Deutschland." />
  <title>Dates · KAVAK Brand Studio</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .events-filter {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }
    .filter-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--gray-200);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      color: var(--gray-400);
      transition: all 0.3s;
    }
    .filter-btn.active,
    .filter-btn:hover {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }
    .events-empty { padding: 4rem; text-align: center; color: var(--gray-400); font-family: var(--font-serif); font-size: 1.5rem; font-weight: 300; font-style: italic; }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <!-- PAGE HEADER -->
  <section class="bg-gray" style="min-height:50vh;display:flex;align-items:flex-end;padding-bottom:5rem;padding-top:var(--nav-height);">
    <div class="container">
      <p class="t-subheadline hero-stagger" style="color:var(--gray-400);margin-bottom:1.5rem;">Termine & Events</p>
      <h1 class="hero-stagger" style="font-family:var(--font-serif);font-size:clamp(3rem,7vw,8rem);font-weight:300;line-height:0.95;letter-spacing:-0.02em;color:var(--black);">
        Ordertage &amp;<br><em>Messen.</em>
      </h1>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="section-pad bg-white">
    <div class="container">

      <div class="events-filter reveal">
        <button class="filter-btn active" data-filter="all">Alle</button>
        <button class="filter-btn" data-filter="messe">Messen</button>
        <button class="filter-btn" data-filter="ordertag">Ordertage</button>
        <button class="filter-btn" data-filter="showroom">Showroom</button>
      </div>

      <table class="events-table reveal">
        <thead>
          <tr>
            <td class="t-small" style="padding-bottom:1rem;color:var(--gray-400);">Datum</td>
            <td class="t-small" style="padding-bottom:1rem;color:var(--gray-400);">Event</td>
            <td class="t-small" style="padding-bottom:1rem;color:var(--gray-400);">Ort</td>
            <td class="t-small" style="padding-bottom:1rem;color:var(--gray-400);">Typ</td>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <!-- Filled by JS -->
        </tbody>
      </table>

    </div>
  </section>

  <!-- SHOWROOM TERMIN -->
  <section class="section-pad bg-black">
    <div class="container">
      <div class="grid-12">
        <div style="grid-column:span 6;">
          <p class="t-subheadline reveal" style="color:var(--gray-400);margin-bottom:1.5rem;">Immer möglich</p>
          <h2 class="t-headline reveal reveal-delay-1" style="color:var(--white);">Showroom-Besuch<br>nach<br><em>Vereinbarung.</em></h2>
        </div>
        <div style="grid-column:span 6;display:flex;flex-direction:column;justify-content:flex-end;gap:1.5rem;">
          <p class="t-body reveal reveal-delay-2" style="color:var(--gray-200);">
            Unser Showroom in Düsseldorf ist ganzjährig zugänglich — nach Vereinbarung. Lernen Sie unsere Brands und Kollektionen in persönlicher Atmosphäre kennen.
          </p>
          <div class="reveal reveal-delay-3">
            <a href="kontakt.html" class="btn btn--white">Termin anfragen</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    /* ---- Events Data (replace with real dates) ---- */
    const events = [
      { date: 'Jan 2026', name: 'Ordertag Frühjahr/Sommer 2026', location: 'Düsseldorf', type: 'ordertag' },
      { date: 'Feb 2026', name: 'PREMIUM Berlin', location: 'Berlin', type: 'messe' },
      { date: 'Feb 2026', name: 'Seek Berlin', location: 'Berlin', type: 'messe' },
      { date: 'Mar 2026', name: 'Showroom Frühjahrsorder', location: 'Düsseldorf', type: 'showroom' },
      { date: 'Jul 2026', name: 'Ordertag Herbst/Winter 2026', location: 'Düsseldorf', type: 'ordertag' },
      { date: 'Jul 2026', name: 'PREMIUM Berlin', location: 'Berlin', type: 'messe' },
      { date: 'Aug 2026', name: 'Showroom Herbstorder', location: 'Düsseldorf', type: 'showroom' },
    ];

    const typeLabels = { messe: 'Messe', ordertag: 'Ordertag', showroom: 'Showroom' };
    const tbody = document.getElementById('eventsTableBody');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let active = 'all';

    function renderEvents() {
      const filtered = active === 'all' ? events : events.filter(e => e.type === active);
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="events-empty">Keine Termine gefunden.</td></tr>`;
        return;
      }
      tbody.innerHTML = filtered.map(e => `
        <tr data-type="${e.type}">
          <td><span class="event-date">${e.date}</span></td>
          <td><span class="event-name">${e.name}</span></td>
          <td><span class="event-location">${e.location}</span></td>
          <td><span class="event-badge">${typeLabels[e.type]}</span></td>
        </tr>
      `).join('');
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        active = btn.dataset.filter;
        renderEvents();
      });
    });

    renderEvents();
  </script>
</body>
</html>
